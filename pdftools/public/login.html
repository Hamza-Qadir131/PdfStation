<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — PDFStation</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="shell topbar-inner">
    <a class="brand" href="/index"><span class="stamp">PS</span> <span class="brand-text">PDFStation</span></a>
    <nav class="topnav" id="nav-auth-slot"></nav>
  </div>
</header>

<div class="auth-wrap">
  <h1>Welcome back</h1>
  <p class="sub">Log in to use your tools and see your file history.</p>

  <form class="auth-form" id="login-form">
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" />
    </div>
    <div>
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" />
    </div>
    <button class="btn btn-primary" type="submit">Log in</button>
    <span class="status-msg error" id="error-msg"></span>
  </form>

  <div class="auth-switch">No account yet? <a href="/register">Sign up free</a></div>
</div>

<script src="/js/config.js"></script>
<script src="/js/effects.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
