<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — PDFStation</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="shell topbar-inner">
    <a class="brand" href="/index.html"><span class="stamp">PS</span> PDFStation</a>
    <nav class="topnav" id="nav-auth-slot"></nav>
  </div>
</header>

<div class="auth-wrap">
  <h1>Create your account</h1>
  <p class="sub">Free — no credit card. Just an email and password.</p>

  <form class="auth-form" id="register-form">
    <div>
      <label for="name">Name (optional)</label>
      <input type="text" id="name" autocomplete="name" />
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" />
    </div>
    <div>
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="new-password" minlength="8" />
    </div>
    <button class="btn btn-primary" type="submit">Sign up</button>
    <span class="status-msg error" id="error-msg"></span>
  </form>

  <div class="auth-switch">Already have an account? <a href="/login.html">Log in</a></div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
